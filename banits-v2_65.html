<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banits Betting v2</title>
<!-- PWA / installable app -->
<meta name="theme-color" content="#02091C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banits">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Banits Betting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── BIRMINGHAM CITY FC THEME ────────────────────────────────
     Home  25/26: Hyper Cobalt (#0047B5) + Jersey Gold (#F0B323) + White
     Away  25/26: Black + Hyper Cobalt gradient sash + White socks
     Third 25/26: Red (#CC1500) + White accents
     Badge:       Pure Blue (#0000FF) + White
  ─────────────────────────────────────────────────────────── */
  /* Backgrounds — deep navy inspired by the away kit's black+cobalt */
  --bg:#02091C;--card:#060F28;--card2:#0A1533;--card3:#0E1B3E;
  /* Borders — cobalt tinted */
  --border:rgba(0,71,181,.18);--border2:rgba(0,71,181,.34);
  /* Text — jersey white tones */
  --text:#EEF2FF;--muted:#7A96C2;--dim:#344D7A;
  /* BCFC brand palette */
  --gold:#F0B323;          /* Jersey Gold — home kit trim, Nike logo */
  --cobalt:#0047B5;        /* Hyper Cobalt — home kit primary */
  --high:#D41515;          /* Third kit red — danger, live, cards */
  --med:#F0B323;           /* Jersey Gold warm tone — medium priority */
  --low:#00B876;           /* Functional green — no BCFC equivalent, kept for clarity */
  --violet:#3A62CC;        /* Mid cobalt — chips, info accents */
  --blue:#1A6FE0;          /* Lighter cobalt — links, highlights */
  /* BCFC gradient: Jersey Gold → Hyper Cobalt */
  --wc-gradient:linear-gradient(90deg,var(--gold) 0%,var(--cobalt) 100%);
  --mono:'JetBrains Mono','Courier New',monospace;--cond:'Barlow Condensed',sans-serif;
  /* Position badges — mapped to kit colours */
  --pos-fwd:#D41515;   /* FWD → Third kit red */
  --pos-mid:#1A6FE0;   /* MID → Light cobalt (away sash) */
  --pos-def:#0047B5;   /* DEF → Hyper Cobalt (home kit) */
  --pos-gk:#F0B323;    /* GK  → Jersey Gold (home kit trim) */
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4}
#app{display:flex;height:100vh}

/* ─── SIDEBAR ─────────────────────────────────────────────── */
#sb{width:245px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-hd{position:relative;padding:14px 13px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-hd::after{content:'';position:absolute;bottom:-1px;left:0;width:100%;height:2px;background:var(--wc-gradient)}
.sb-logo{font-family:var(--cond);font-size:20px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer;transition:opacity .15s;user-select:none;background:linear-gradient(90deg,#EEF2FF 30%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-logo:hover{opacity:.8}
.sb-logo i{color:var(--cobalt);font-size:22px;-webkit-text-fill-color:var(--cobalt);flex-shrink:0}
.sb-logo small{font-size:9px;letter-spacing:.05em;color:var(--dim);font-weight:400;text-transform:none;align-self:flex-end;margin-bottom:2px;-webkit-text-fill-color:var(--dim);background:none}
.sb-date-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-bottom:1px solid var(--border);flex-shrink:0;gap:6px}
.sb-date-nav button{background:var(--card2);border:1px solid var(--border2);color:var(--text);cursor:pointer;padding:5px 10px;border-radius:6px;transition:all .15s;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;flex-shrink:0}
.sb-date-nav button:hover{background:var(--card3);border-color:var(--gold);color:var(--gold)}
.sb-date-nav button i{font-size:13px}
#sb-date-lbl{font-size:11px;color:var(--text);font-weight:600;letter-spacing:.03em}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-on{background:var(--low)}.dot-off{background:var(--dim)}
#sb-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
#sb-list::-webkit-scrollbar{width:3px}
#sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.comp-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:700;padding:9px 12px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fix-row{padding:7px 12px 6px;cursor:pointer;border-left:2px solid transparent;transition:all .14s;border-bottom:1px solid rgba(255,255,255,.025);overflow:hidden}
.fix-row:hover{background:rgba(255,255,255,.03);border-left-color:var(--border2)}
.fix-row.on{background:rgba(255,255,255,.055);border-left-color:var(--gold)}
.fix-teams-row{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
/* FIX: Team names truncate cleanly — 11px font, proper min-width:0 */
.fx-home,.fx-away{font-size:11px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-away{text-align:right}
.fx-mid{font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;min-width:38px;text-align:center}
.fx-mid.live-c{color:var(--high)}
.badge-sm{width:16px;height:16px;object-fit:contain;flex-shrink:0;vertical-align:middle}
.badge-md{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.badge-lg{width:48px;height:48px;object-fit:contain;flex-shrink:0}
/* Fallback shown when logo image fails to load */
.badge-fb{display:inline-flex;align-items:center;justify-content:center;border-radius:3px;background:var(--card3);color:var(--dim);font-weight:700;font-family:var(--mono);flex-shrink:0;line-height:1;vertical-align:middle}
.badge-fb.badge-sm{width:16px;height:16px;font-size:5px}
.badge-fb.badge-md{width:22px;height:22px;font-size:6px}
.badge-fb.badge-lg{width:48px;height:48px;font-size:11px;border-radius:6px}
.fix-meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:9px;color:var(--dim)}
.live-pip{display:inline-flex;align-items:center;gap:3px;color:var(--high);font-weight:700;font-size:8px}
.live-pip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--high);animation:pulse 1.5s infinite;display:inline-block}
.sb-ft{padding:10px 12px;border-top:1px solid var(--border);font-size:9px;color:var(--dim);line-height:1.8;flex-shrink:0}
.sb-ft-ttl{text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--dim);margin-bottom:3px}

/* ─── SEASON TOGGLE ──────────────────────────────────────────── */
.sb-season-tog{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.sb-season-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700;white-space:nowrap}
.sb-season-btns{display:flex;gap:3px}
.stog-btn{background:var(--card2);border:1px solid var(--border);color:var(--dim);font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;cursor:pointer;transition:all .15s;font-family:var(--mono)}
.stog-btn:hover{border-color:var(--border2);color:var(--muted)}
.stog-btn.on{background:rgba(0,71,181,.2);border-color:var(--cobalt);color:var(--cobalt)}
/* ─── SIDEBAR LEAGUE FILTER ──────────────────────────────────── */
.sb-league-filter{padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-league-sel{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:10px;padding:5px 8px;cursor:pointer;outline:none;transition:border-color .15s}
.sb-league-sel:hover,.sb-league-sel:focus{border-color:var(--cobalt)}
.sb-league-sel option{background:var(--card2);color:var(--text);font-size:11px}
.lp-filter-row{margin-bottom:12px}
.lp-league-sel{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;padding:8px 10px;cursor:pointer;outline:none;transition:border-color .15s}
.lp-league-sel:hover,.lp-league-sel:focus{border-color:var(--cobalt)}
.lp-league-sel option{background:var(--card2);color:var(--text)}
#sb-hamburger{display:none;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;background:var(--card2);border:1px solid var(--border2);border-radius:7px;cursor:pointer;color:var(--text);font-size:11px;font-weight:600;flex-shrink:0;white-space:nowrap}
#sb-hamburger i{font-size:15px}
#sb-hamburger:hover{border-color:var(--gold);color:var(--gold)}

/* ─── UNIVERSAL BACK BUTTON ───────────────────────────────────── */
.btn-back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--card2);border:1px solid var(--border2);border-radius:7px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;transition:all .15s;white-space:nowrap;flex-shrink:0}
.btn-back i{font-size:14px}
.btn-back:hover{border-color:var(--gold);color:var(--gold);background:var(--card3)}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
/* FIX: Landing no longer centres content — full-page layout */
#landing{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg)}
#landing::-webkit-scrollbar{width:3px}
#landing::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* ─── LANDING PAGE ──────────────────────────────────────────── */
.lp-hero{position:relative;padding:22px 28px 18px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.lp-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--wc-gradient)}
.lp-logo{font-family:var(--cond);font-size:30px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:var(--text)}
.lp-logo i{color:var(--cobalt);font-size:28px}
.lp-tagline{font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.04em}
/* Setup instructions card */
.lp-setup{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0 0;font-size:11px}
.lp-setup-hd{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--cobalt);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.lp-setup-steps{display:flex;flex-direction:column;gap:7px}
.lp-setup-step{display:flex;align-items:flex-start;gap:10px}
.lp-setup-n{width:18px;height:18px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:9px;font-weight:800;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.lp-setup-txt{flex:1;color:var(--muted);line-height:1.4}
.lp-setup-txt b{color:var(--text)}
.lp-cmd{display:inline-block;background:rgba(0,0,0,.3);border:1px solid var(--border2);border-radius:5px;padding:2px 7px;font-family:var(--mono);font-size:10px;color:var(--gold);margin:3px 0;cursor:pointer;user-select:all;transition:border-color .15s}
.lp-cmd:hover{border-color:var(--gold)}
.lp-setup-url{font-family:var(--mono);font-size:10px;color:var(--low);text-decoration:none}
.lp-setup-url:hover{text-decoration:underline}
.lp-hero-stats{display:flex;gap:22px;flex-shrink:0}
.lp-hstat{text-align:center}
.lp-hstat-n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.lp-hstat-l{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-top:4px}
.lp-body{flex:1;padding:16px 22px 24px;overflow:visible;display:flex;gap:18px;align-items:flex-start}
.lp-main{flex:1;min-width:0}
.lp-section{margin-bottom:20px}
.lp-sec-hd{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.lp-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.lp-card:hover{background:var(--card2);border-color:var(--border2);transform:translateY(-1px)}
.lp-card.lp-live{border-left-color:var(--high);background:rgba(212,21,21,.05)}
.lp-card.lp-fin{opacity:.7}
.lp-card-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lp-tm{font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-tm.away{text-align:right}
.lp-sc{font-family:var(--mono);font-size:14px;font-weight:800;flex-shrink:0;min-width:36px;text-align:center;color:var(--text)}
.lp-sc.live-sc{color:var(--high)}
.lp-card-foot{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--dim)}
.lp-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim);font-size:12px;padding:40px}
.lp-empty i{font-size:36px;color:var(--card2)}

/* ─── RESULTS PANEL (landing page, right column) ─────────────────── */
.lp-results-col{width:340px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;align-self:flex-start;position:sticky;top:16px}
.lp-results-col::-webkit-scrollbar{width:3px}
.lp-results-col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.lpr-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;border-left:3px solid transparent}
.lpr-card:hover{border-color:var(--border2)}
.lpr-card.lpr-live{border-left-color:var(--high)}
.lpr-teams{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.lpr-tm{font-size:11px;font-weight:600;flex:1;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpr-tm.away{justify-content:flex-end;text-align:right}
.lpr-sc{font-family:var(--mono);font-size:13px;font-weight:800;flex-shrink:0;min-width:38px;text-align:center;color:var(--text)}
.lpr-sc.live-sc{color:var(--high)}
.lpr-status{font-size:9px;color:var(--dim);margin-bottom:6px}
.lpr-events{border-top:1px solid var(--border);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.lpr-ev{display:flex;font-size:10px;color:var(--muted);gap:5px;align-items:center}
.lpr-ev b{font-family:var(--mono);color:var(--dim);font-weight:700}
.lpr-ev-ico{font-size:11px;flex-shrink:0}
.lpr-ev.away{justify-content:flex-end;text-align:right}
@media(max-width:1050px){
  .lp-body{flex-direction:column}
  .lp-results-col{width:100%;position:static;max-height:none;order:-1}
}

/* ─── MATCH VIEW ────────────────────────────────────────────── */
#mv{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mv-hdr{position:relative;background:var(--card);border-bottom:1px solid var(--border);padding:14px 22px;flex-shrink:0}
.mv-hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--wc-gradient)}
.chip-wc{background:linear-gradient(90deg,rgba(255,199,44,.18),rgba(25,211,142,.18));color:var(--gold);border:1px solid rgba(255,199,44,.35);font-weight:800}
.mh-comp{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.mh-scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.mh-team-h{display:flex;flex-direction:column;align-items:flex-start}
.mh-team-a{display:flex;flex-direction:column;align-items:flex-end}
.mh-top-row{display:flex;align-items:center;gap:10px}
.mh-team-a .mh-top-row{flex-direction:row-reverse}
.mh-abbr{font-family:var(--cond);font-size:36px;font-weight:900;letter-spacing:.04em;line-height:1}
.mh-nm{font-size:11px;color:var(--muted);margin-top:2px}
.mh-ctr{text-align:center}
.mh-sc{font-family:var(--mono);font-size:42px;font-weight:700;letter-spacing:.08em;line-height:1}
.mh-st{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.mh-st.live-txt{color:var(--high);font-weight:700}
.mh-info{font-size:10px;color:var(--dim);margin-top:6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px}
.chip{font-size:8px;padding:2px 6px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
.chip-live{background:rgba(212,21,21,.15);color:var(--high);border:1px solid rgba(212,21,21,.3)}
.chip-ft{background:rgba(255,255,255,.07);color:var(--dim)}
.chip-ns{background:rgba(240,179,35,.1);color:var(--med)}
.chip-af{background:rgba(58,98,204,.1);color:var(--violet);border:1px solid rgba(58,98,204,.25)}

/* ─── TABS ── FIX: hide the scrollbar on the tab-nav row ───── */
.tab-nav{display:flex;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;padding:0 16px;gap:0;overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:9px 13px;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--dim);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .14s;white-space:nowrap}
.tab-btn:hover{color:var(--muted)}
.tab-btn.on{color:var(--text);border-bottom-color:var(--gold)}
.tab-panels{flex:1;overflow:hidden;position:relative}
.tab-pnl{position:absolute;inset:0;overflow-y:auto;padding:18px 22px;display:none;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.tab-pnl::-webkit-scrollbar{width:3px}
.tab-pnl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.tab-pnl.on{display:block}
/* Inner container caps content width on large screens */
.tab-inner{max-width:1100px;margin:0 auto}
/* Auto-constrain tab panels at wide widths without touching JS templates */
@media(min-width:1400px){
  .tab-pnl.on{display:flex;flex-direction:column;align-items:stretch}
  .tab-pnl.on>*{max-width:1200px;width:100%;margin-left:auto;margin-right:auto;flex-shrink:0}
  .tab-pnl.on>.sa-cols{max-width:1200px}
  /* Landing page body: cap total width */
  .lp-body{max-width:1600px;margin-left:auto;margin-right:auto;padding-left:28px;padding-right:28px}
  /* Match header: cap width */
  .mv-hdr>div{max-width:1200px;margin:0 auto}
  /* Analysis two-col wider gap */
  .two-col{gap:28px}
  /* WC fixtures: more columns at wide widths */
  .wc-fix-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
}

/* ─── SHARED COMPONENTS ─────────────────────────────────────── */
.stitle{font-family:var(--cond);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stitle i{color:var(--gold);font-size:13px}
.no-data{text-align:center;color:var(--dim);padding:36px 20px;font-size:12px;line-height:1.8}
.no-data i{font-size:32px;display:block;margin-bottom:10px;color:var(--card2)}
.no-data strong{color:var(--muted)}
.ld-msg{color:var(--muted);font-size:12px;padding:30px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column}
.ld-progress{width:220px;height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:4px}
.ld-progress-fill{height:100%;background:var(--cobalt);border-radius:2px;transition:width .25s ease}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.spnr{width:16px;height:16px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ─── EVENT TIMELINE ─────────────────────────────────────────── */
.ev-list{display:flex;flex-direction:column;gap:3px}
.ev-item{display:flex;align-items:flex-start;gap:9px;padding:6px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--border)}
.ev-t{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:32px;text-align:right;flex-shrink:0;padding-top:1px}
.ev-ico{font-size:15px;min-width:20px;text-align:center;flex-shrink:0;padding-top:1px}
.ev-det{flex:1;min-width:0}
.ev-pl{font-size:12px;font-weight:500}
.ev-sub{font-size:10px;color:var(--dim);margin-top:2px}
.ev-tm{font-size:9px;color:var(--dim);flex-shrink:0;padding-top:2px;font-weight:600;letter-spacing:.04em}

/* ─── STAT BARS ───────────────────────────────────────────────── */
.stat-row{margin-bottom:9px}
.stat-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:4px}
.stat-lbl .sv{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stat-track{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;display:flex}
.stat-h,.stat-a{height:100%;transition:width .4s}

/* ─── PITCH ── FIX: reduced aspect ratio, larger names ─────── */
.pitch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pitch-box{text-align:center}
.pitch-box-lbl{font-size:10px;color:var(--dim);margin-bottom:5px;display:flex;justify-content:space-between;padding:0 2px}
/* FIX: was 148% (far too tall). 115% gives a more usable formation view */
.pitch{position:relative;width:100%;padding-top:128%;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#1a5c1a 0%,#276827 35%,#276827 65%,#1a5c1a 100%)}
.pitch::before{content:'';position:absolute;top:50%;left:8%;right:8%;height:1px;background:rgba(255,255,255,.09)}
.pitch::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.09);transform:translate(-50%,-50%)}
.pp{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:default;z-index:2}
.pp-circ{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:2.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:16px;font-weight:800;color:#fff;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pp-circ.sub-off{background:rgba(212,21,21,.4);border-color:#D41515}
.pp-num{position:relative;z-index:1;font-family:var(--mono)}
.pp-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;z-index:2;background:var(--card2)}
.pp-circ.sub-off .pp-photo{opacity:.55}
.pp-badge{position:absolute;bottom:-3px;right:-3px;background:var(--high);border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center;font-weight:900;z-index:3;border:2px solid var(--bg)}
/* Sub time inline in badge */
.pp-badge.pp-badge-sub{width:auto;border-radius:9px;padding:0 4px;font-size:8px;font-weight:700;background:var(--high);color:#fff;white-space:nowrap}
/* Card icon floating above circle */
.pp-card{position:absolute;top:-6px;right:-6px;font-size:12px;z-index:4;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
/* Kit number overlays photo bottom-left, z-index above photo */
.pp-kit-num{position:absolute;bottom:0;left:0;background:rgba(5,12,30,.82);border-radius:0 4px 0 6px;font-family:var(--mono);font-size:8px;font-weight:900;color:#fff;padding:1px 3px;z-index:5;min-width:14px;text-align:center;line-height:1.5;border-top:1px solid rgba(255,255,255,.12);border-right:1px solid rgba(255,255,255,.12)}

/* ─── FORM STRIP ──────────────────────────────────────────── */
.form-strip{display:flex;gap:3px;align-items:center}
.form-b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;transition:transform .12s;cursor:default}
.form-b:hover{transform:scale(1.2)}
.form-w{background:#16a34a}
.form-d{background:#ca8a04}
.form-l{background:#dc2626}
/* ─── HEADER CONTEXT ROW ─────────────────────────────────── */
.mh-ctx{display:flex;align-items:center;justify-content:space-between;padding:8px 0 0;gap:16px;flex-wrap:wrap}
.mh-ctx-team{display:flex;align-items:center;gap:6px}
.mh-ctx-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;min-width:20px}
/* ─── LEAGUE TABLE ───────────────────────────────────────── */
.mini-table{background:var(--card2);border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-top:8px}
.mini-table-row{display:grid;grid-template-columns:22px 1fr 46px 36px 36px;align-items:center;padding:5px 10px;font-size:10px;gap:4px;border-bottom:1px solid rgba(0,0,0,.2);transition:background .12s}
.mini-table-row:last-child{border-bottom:none}
.mini-table-row.hl{background:rgba(0,71,181,.1);border-left:2px solid var(--cobalt)}
.mini-table-row:hover{background:rgba(255,255,255,.03)}
.mt-pos{color:var(--dim);font-family:var(--mono);text-align:center;font-size:9px}
.mt-team{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-pts{text-align:right;font-family:var(--mono);font-weight:800;color:var(--text)}
.mt-gd{text-align:right;font-family:var(--mono);font-size:9px;color:var(--dim)}
.mt-form{display:flex;gap:2px;justify-content:flex-end}
.mt-fb{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.mini-table-gap{text-align:center;color:var(--dim);padding:2px;font-size:11px}
/* ─── CARD SUMMARY BANNER ────────────────────────────────── */
.csb{display:flex;align-items:center;background:linear-gradient(135deg,rgba(0,71,181,.08),rgba(5,12,30,0));border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:14px;gap:8px}
.csb-team{flex:1;text-align:center;min-width:0}
.csb-nm{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.csb-num{font-size:30px;font-weight:900;font-family:var(--cond);line-height:1;letter-spacing:-.02em}
.csb-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-top:2px}
.csb-mid{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;padding:0 6px}
.csb-mid-ico{font-size:18px}
.csb-mid-txt{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
/* ─── REF BADGE ──────────────────────────────────────────── */
.ref-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--muted)}
/* ─── CONTEXT SECTION ────────────────────────────────────── */
.ctx-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.ctx-sec-hd{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--cobalt);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.ctx-form-row{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.ctx-form-nm{font-size:10px;font-weight:700;min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ─── LANDING CARD IMPROVEMENTS ─────────────────────────── */
.lp-card{transition:transform .12s,box-shadow .12s,border-color .12s}
.lp-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35);border-color:rgba(0,71,181,.3)}
.lp-card.lp-live{border-left:2px solid var(--high)}
.lp-card.lp-fin{opacity:.85}
/* ─── POSITION BADGE IN TABLE ────────────────────────────── */
.pos-badge{display:inline-flex;align-items:center;justify-content:center;background:rgba(0,71,181,.15);border:1px solid rgba(0,71,181,.25);border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;color:var(--cobalt);font-family:var(--mono)}
/* Kit number pill in analysis cards */
.sa-kit-num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:16px;padding:0 3px;background:var(--card3);border:1px solid var(--border2);border-radius:4px;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--muted);flex-shrink:0;margin-right:5px;vertical-align:middle}
/* Substitutes panel below each pitch */
.pp-subs-panel{margin-top:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pp-subs-hd{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.pp-sub-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.pp-sub-row:last-child{border-bottom:none}
.pp-sub-row.pp-sub-on{background:rgba(0,184,118,.04)}
.pp-sub-num{font-family:var(--mono);font-size:10px;font-weight:700;width:18px;flex-shrink:0;text-align:center}
.pp-sub-photo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--card3)}
.pp-sub-nophoto{display:flex;align-items:center;justify-content:center;color:var(--dim)}
.pp-sub-info{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.pp-sub-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.pp-sub-pos{font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700;flex-shrink:0}
.pp-sub-arrow{font-size:10px;font-weight:700;flex-shrink:0;white-space:nowrap}
.pp-sub-on-arr{color:var(--low)}
.pp-sub-off-arr{color:var(--dim)}
.pp-name{font-size:11px;font-weight:700;color:rgba(255,255,255,.95);margin-top:4px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pp-subt{font-size:9px;color:var(--high);line-height:1.3;font-weight:700}
.pp-stat{font-size:10px;font-weight:800;font-family:var(--mono);margin-top:2px;background:rgba(0,0,0,.55);border-radius:4px;padding:1px 5px;display:inline-block;line-height:1.5}
.pitch-stat-toggle{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pitch-stat-lbl{font-size:10px;color:var(--dim);margin-right:2px}
.pitch-stat-btn{font-size:10px;font-weight:600;color:var(--dim);background:var(--card2);border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .14s}
.pitch-stat-btn:hover{color:var(--muted);border-color:var(--border2)}
.pitch-stat-btn.on{color:var(--gold);border-color:rgba(240,179,35,.35);background:rgba(240,179,35,.08)}

/* ─── LINEUP LIST ─────────────────────────────────────────────── */
.lu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lu-thd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.lu-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lu-num{font-size:10px;color:var(--dim);min-width:21px;text-align:right;font-family:var(--mono)}
.lu-name{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.lu-name.dim{color:var(--dim);font-weight:400}
.lu-pos{font-size:8px;color:var(--dim);background:rgba(255,255,255,.06);padding:1px 4px;border-radius:3px;letter-spacing:.04em;flex-shrink:0}
.lu-sub-txt{font-size:9px;margin-left:3px;flex-shrink:0}
.sub-on-c{color:var(--low)}.sub-off-c{color:var(--high)}
.lu-sec-hd{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:9px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px}

/* ─── LIVE STATS TABLE ───────────────────────────────────────── */
.ls-wrap{overflow-x:auto}
.ls-tbl{width:100%;border-collapse:collapse;font-size:11px}
.ls-tbl th{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700;padding:6px 7px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.ls-tbl th:first-child{text-align:left}
.ls-tbl td{padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.035);text-align:center;color:var(--muted)}
.ls-tbl td:first-child{text-align:left;color:var(--text);font-weight:500;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-tbl .team-sep{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:9px 7px 4px;border-bottom:1px solid var(--border)}
.rat{font-weight:700;padding:2px 5px;border-radius:4px;font-size:10px}
.rat-hi{background:rgba(0,184,118,.2);color:var(--low)}
.rat-md{background:rgba(240,179,35,.18);color:var(--med)}
.rat-lo{background:rgba(212,21,21,.18);color:var(--high)}
.fc-hi{color:var(--high);font-weight:700}.fc-md{color:var(--med)}

/* ─── SEASON ANALYSIS ─────────────────────────────────────────── */
.sa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.sa-grid{grid-template-columns:1fr}}
.sa-thd{font-size:12px;font-weight:600;margin-bottom:10px}
.sa-xi-hd{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--low);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:5px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sa-xi-bench{color:var(--dim);margin-top:16px}
/* Bench player cards slightly dimmed */
.sa-card.bench-card{opacity:.8}
.sa-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:border-color .14s}
.sa-card:hover{border-color:var(--border2)}
.sa-card.low-conf{border-style:dashed;opacity:.85}
.sa-card.no-data-card{opacity:.5}
.sa-card.open{border-color:var(--border2)}
.sa-expand{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none}
.sa-card.open .sa-expand{display:block}
/* FIX: was all Courier New — now uses system sans, numbers only in mono */
.sa-ex-row{font-size:11px;color:var(--dim);line-height:2.1;display:flex;gap:8px;align-items:baseline}
.sa-ex-row .lbl{color:var(--dim);min-width:110px;flex-shrink:0}
.sa-ex-row .val{color:var(--muted);font-family:var(--mono);font-size:11px}
.sa-ex-formula{font-size:11px;background:rgba(255,255,255,.04);border-radius:6px;padding:10px 12px;margin-top:8px;line-height:2;color:var(--muted)}
.sa-ex-formula div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sa-ex-formula .nm{font-family:var(--mono);font-size:11px}
.sa-ex-formula .hi{color:var(--high);font-family:var(--mono)}
.sa-ex-formula .md{color:var(--med);font-family:var(--mono)}
.sa-ex-formula .lo{color:var(--low);font-family:var(--mono)}
.sa-ex-warn{font-size:11px;color:var(--med);margin-top:8px;padding:7px 10px;background:rgba(240,179,35,.07);border-radius:5px;border-left:2px solid var(--med);line-height:1.6}
.sa-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.sa-nm{font-size:12px;font-weight:600}
.sa-pos-badge{font-size:8px;color:var(--dim);background:rgba(255,255,255,.06);padding:1px 4px;border-radius:3px;margin-left:5px;letter-spacing:.04em;font-weight:700}
.sa-pct{font-family:var(--mono);font-size:18px;font-weight:800;flex-shrink:0}
.sa-pct.hi{color:var(--high)}.sa-pct.md{color:var(--med)}.sa-pct.lo{color:var(--low)}
.sa-bar{height:4px;background:rgba(255,255,255,.09);border-radius:2px;margin-bottom:6px;overflow:hidden}
.sa-bar-fill{height:100%;border-radius:2px;transition:width .5s}
.sa-meta{display:flex;gap:10px;font-size:10px;color:var(--dim);flex-wrap:wrap}
.sa-meta b{color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:700}
.tip-box{background:rgba(58,98,204,.08);border:1px solid rgba(58,98,204,.2);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:11px;color:var(--muted);line-height:1.7}
.tip-box code{color:var(--low);font-family:var(--mono)}

/* ─── POSITION COLOUR BADGES (FWD=red, MID=green, DEF=blue, GK=yellow) ──── */
.pos-F{color:var(--pos-fwd);background:rgba(255,75,92,.12);border:1px solid rgba(255,75,92,.3)}
.pos-M{color:var(--pos-mid);background:rgba(25,211,142,.12);border:1px solid rgba(25,211,142,.3)}
.pos-D{color:var(--pos-def);background:rgba(77,163,255,.12);border:1px solid rgba(77,163,255,.3)}
.pos-G{color:var(--pos-gk);background:rgba(255,224,102,.12);border:1px solid rgba(255,224,102,.3)}

/* ─── MATCHUPS TAB ─────────────────────────────────────────────── */
.mu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.mu-grid{grid-template-columns:1fr}}
.mu-sec-hd{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.mu-card{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin-bottom:8px}
.mu-side{min-width:0}
.mu-side-r{text-align:right}
.mu-role{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700;margin-bottom:2px}
.mu-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-pos{font-size:8px;padding:1px 4px;border-radius:3px;display:inline-block;margin-top:2px;letter-spacing:.04em;font-weight:700}
.mu-stat-row{display:flex;gap:8px;font-size:9px;color:var(--dim);margin-top:5px;flex-wrap:wrap}
.mu-side-r .mu-stat-row{justify-content:flex-end}
.mu-stat-row b{color:var(--muted);font-family:var(--mono);font-weight:400;font-size:10px}
.mu-vs{text-align:center;flex-shrink:0;padding:0 4px}
.mu-vs i{color:var(--dim);font-size:14px;display:block;margin-bottom:4px}
.mu-tier{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:8px;white-space:nowrap}
.mu-tier.hi{background:rgba(212,21,21,.15);color:var(--high)}
.mu-tier.md{background:rgba(240,179,35,.15);color:var(--med)}
.mu-tier.lo{background:rgba(0,184,118,.12);color:var(--low)}

/* ─── TOP PICKS TAB ────────────────────────────────────────────── */
.tp-list{display:flex;flex-direction:column;gap:6px}
.tp-row{display:flex;flex-direction:column;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.tp-row-top{display:flex;align-items:center;gap:10px}
.tp-rank{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:700;flex-shrink:0;width:22px}
.tp-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--card3);border:1px solid var(--border2)}
.tp-info{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.tp-pos{font-size:8px;padding:1px 5px;border-radius:3px;letter-spacing:.04em;text-align:center;font-weight:700;flex-shrink:0}
.tp-team-lbl{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-pct{font-family:var(--mono);font-size:18px;font-weight:800;text-align:right;flex-shrink:0}
.tp-pct.hi{color:var(--high)}.tp-pct.md{color:var(--med)}.tp-pct.lo{color:var(--low)}
.tp-meta{font-size:10px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;padding-left:42px}
.tp-meta b{color:var(--muted);font-family:var(--mono);font-weight:700;font-size:10px}
.tp-meta .tp-src{color:var(--dim);margin-left:auto}

.tp-foul-hdr{display:grid;grid-template-columns:28px 28px 1fr 40px 1fr 64px 46px 46px 46px;gap:8px;padding:0 12px 6px;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700}
.tp-foul-hdr span:nth-child(6),.tp-foul-hdr span:nth-child(7),.tp-foul-hdr span:nth-child(8),.tp-foul-hdr span:nth-child(9){text-align:right}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE LAYOUT SYSTEM
   ─────────────────────────────────────────────────────────────
   3 tiers:
   A. Wide desktop ≥1400px  — cap content width, generous padding
   B. Tablet       600–1024px — narrower sidebar, tighter grids
   C. Mobile       <600px     — sidebar becomes a slide-out drawer
═══════════════════════════════════════════════════════════════ */

/* A. Wide desktop — content cap so nothing stretches beyond readability */
@media(min-width:1400px){
  .tab-inner{max-width:1200px}
  .lp-main .lp-grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
  .lp-results-col{width:360px}
  .sa-cols{grid-template-columns:1fr 1fr;gap:24px}
  .mu-grid{grid-template-columns:1fr 1fr;gap:20px}
  .wcp-grid{grid-template-columns:repeat(4,1fr)}
  .wc-groups-grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:1200px){
}
@media(max-width:1024px){
  #sb{width:210px}
  .lp-body{flex-direction:column}
  .lp-results-col{width:100%;position:static;max-height:none;order:-1}
  .two-col{grid-template-columns:1fr!important}
  .mu-grid{grid-template-columns:1fr!important}
  .wcp-grid{grid-template-columns:1fr 1fr}
  .wc-groups-grid{grid-template-columns:repeat(3,1fr)}
  .pitch-grid{grid-template-columns:1fr!important}
}

/* C. Mobile — sidebar becomes drawer, everything stacks */
@media(max-width:600px){
  #sb{
    position:fixed;left:0;top:0;bottom:0;z-index:100;
    transform:translateX(-100%);transition:transform .25s;
    box-shadow:4px 0 24px rgba(0,0,0,.5);
    width:280px
  }
  #sb.sb-open{transform:translateX(0)}
  #sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
  #sb-overlay.visible{display:block}
  #main{flex:1}
  /* Hamburger button appears on mobile */
  #sb-hamburger{display:flex!important}
  /* Header adapts */
  .lp-hero{flex-direction:column;gap:8px;padding:12px 16px}
  .lp-hero-stats{gap:14px}
  .mh-abbr{font-size:24px}
  .mh-sc{font-size:28px}
  .tab-pnl{padding:12px 14px}

function tinfo(name=''){
  const direct=TC[name]; if(direct)return direct;
  for(const[k,v]of Object.entries(TC)){if(name.includes(k)||k.includes(name))return v;}
  let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))&0xfffffff;

  const abbr=words.length>=2?words.map(w=>w[0]).join('').slice(0,3).toUpperCase():name.slice(0,3).toUpperCase();

// Render a team badge <img> from API-Football's CDN. If the image fails to load
// (some lower-tier teams have no logo), it's removed so layout doesn't break —
// the team's coloured abbreviation/name remains the fallback.
function badge(logoUrl, size='sm', alt=''){
  // Build abbreviated fallback text (e.g. "USA", "BRA", "Man Utd" → "MU")
  const abbr = alt ? alt.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase() : '';
  const fallbackHtml = abbr
    ? `<span class="badge-fb badge-${size}" title="${alt}">${abbr}</span>`
    : '';
  if(!logoUrl) return fallbackHtml;
  // onerror replaces with coloured abbreviation rather than just removing
  const errReplace = abbr
    ? `this.outerHTML='<span class=\\'badge-fb badge-${size}\\' title=\\'${alt.replace(/'/g,'')}\\' >${abbr}</span>'`
    : 'this.remove()';
  return`<img src="${logoUrl}" alt="${alt}" class="badge-${size}" loading="lazy" onerror="${errReplace}">`;
}

function isoDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function selDate(){const d=new Date();d.setDate(d.getDate()+_dayOffset);return d}
function dayLabel(d){
  const ds=isoDate(d),ts=isoDate(new Date()),tmrs=isoDate(new Date(Date.now()+864e5),),yests=isoDate(new Date(Date.now()-864e5));
  if(ds===ts)return'Today';if(ds===tmrs)return'Tomorrow';if(ds===yests)return'Yesterday';
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function fmtTime(dateStr){return new Date(dateStr).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'})}
function isLive(st){return LIVE_STATUSES.has(st)}
function isFinal(st){return FINAL_STATUSES.has(st)}
function statusDisp(f){
  const st=f.fixture.status;

function isEuroAdult(f){

async function afFetch(path){
  // Direct API call for fixture/WC/standings data.
  if(path.startsWith('/players') && path.includes('search=')) return null;
  // Player team queries use no-store so season changes always fetch fresh data
  const cacheMode = path.startsWith('/players?team=') ? 'no-store' : 'default';
  return queueAfCall(async()=>{
    try{
      _callCount++;
      document.getElementById('sb-calls').textContent=`API calls: ${_callCount}`;
      const r=await fetch(_apiBase()+path,{headers:_apiHdrs(), cache:cacheMode});
      if(!r.ok)return null;
      const d=await r.json();
      if(d.errors&&Object.keys(d.errors).length){
        if(d.errors.rateLimit||d.errors['rate-limit']){
          // Rate limit in body — back off 1s then signal as 429 for retry
          await new Promise(res=>setTimeout(res,1000));
          return '429';
        }
        console.warn('[AF]',d.errors);return null;
      }
      return d;
    }catch(e){console.warn('[AF]',e.message);return null;}
  });
}

async function loadFixtures(){
  const d=selDate();
  document.getElementById('sb-date-lbl').textContent=dayLabel(d);
  const list=document.getElementById('sb-list');
  list.innerHTML='<div class="ld-msg"><div class="spnr"></div>Loading fixtures…</div>';

  let data = await afFetch(`/fixtures?date=${isoDate(d)}&timezone=Europe%2FLondon`);
  // Retry once on rate limit (worker caching means second call usually succeeds)
  if(data==='429'||!data){
    await new Promise(r=>setTimeout(r,1500));
    data = await afFetch(`/fixtures?date=${isoDate(d)}&timezone=Europe%2FLondon`);
  }
  const fixtures=data?.response||[];

  if(!fixtures.length){list.innerHTML='<div class="no-data">No fixtures found for this date.</div>';renderLanding();return;}

  _fixturesCache = fixtures;
  renderLanding(); // update landing page with fresh data

  // Filter to European adult leagues only
  const euroAll = fixtures.filter(isEuroAdult);
  // Apply league filter if set
  const visible = _leagueFilter ? euroAll.filter(f=>f.league.id===_leagueFilter) : euroAll;

  // Build league dropdown options (sorted by league rank)
  const lgMap={};
  for(const f of euroAll){
    if(!lgMap[f.league.id])lgMap[f.league.id]={id:f.league.id,name:f.league.name,country:f.league.country,n:0};
    lgMap[f.league.id].n++;
  }
  const lgOpts=Object.values(lgMap)
    .sort((a,b)=>leagueSort(a)-leagueSort(b))
    .map(l=>`<option value="${l.id}"${_leagueFilter===l.id?' selected':''}>${l.country&&l.country!=='World'?l.country+' · ':''} ${l.name} (${l.n})</option>`)
    .join('');
  const filterHtml=`<div class="sb-league-filter">
    <select class="sb-league-sel" onchange="setSbLeagueFilter(this.value?+this.value:null)">
      <option value="">All leagues (${euroAll.length})</option>
      ${lgOpts}
    </select>
  </div>`;

  // Group by league
  const groups={};
  for(const f of visible){
    const key=f.league.id+'_'+f.league.name;
    if(!groups[key])groups[key]={id:f.league.id,name:f.league.name,country:f.league.country,items:[]};
    groups[key].items.push(f);
  }

  // Sort groups by league rank (English first), then fixtures within: live → upcoming → finished
  const sortedGroups=Object.values(groups).sort((a,b)=>leagueSort(a)-leagueSort(b));
  const sortPri=f=>isLive(f.fixture.status.short)?0:isFinal(f.fixture.status.short)?2:1;
  let html=filterHtml;
  for(const g of sortedGroups){
    g.items.sort((a,b)=>(sortPri(a)-sortPri(b))||new Date(a.fixture.date)-new Date(b.fixture.date));
    const comp=g.country&&g.country!=='World'?`${g.country} — ${g.name}`:g.name;
    html+=`<div class="comp-lbl">${comp}</div>`;
    for(const f of g.items){
      const live=isLive(f.fixture.status.short);
      const ht=tinfo(f.teams.home.name);
      const at=tinfo(f.teams.away.name);
      const hasScore=f.goals.home!==null;
      const mid=hasScore?`${f.goals.home}&ndash;${f.goals.away}`:statusDisp(f);
      html+=`<div class="fix-row${f.fixture.id===_activeId?' on':''}" onclick="openMatch(${f.fixture.id})">
        <div class="fix-teams-row">
          ${badge(f.teams.home.logo,'sm',f.teams.home.name)}
          <span class="fx-home" style="color:${ht.c}">${f.teams.home.name}</span>
          <span class="fx-mid${live?' live-c':''}">${mid}</span>
          <span class="fx-away" style="color:${at.c}">${f.teams.away.name}</span>
          ${badge(f.teams.away.logo,'sm',f.teams.away.name)}
        </div>
        <div class="fix-meta-row">
          ${live?'<span class="live-pip">LIVE</span>':'<span></span>'}
          <span>${live?f.fixture.status.elapsed+"'":isFinal(f.fixture.status.short)?'Full time':'Upcoming'}</span>
        </div>
      </div>`;
    }
  }

  list.innerHTML=html;
}

// SECTION 6 — OPEN MATCH (THE CORE CALL)
// ═══════════════════════════════════════════════════════════════
async function openMatch(fid){
  if(_refreshTmr){clearInterval(_refreshTmr);_refreshTmr=null;}
  _activeId=fid;

  // Highlight sidebar row
  document.querySelectorAll('.fix-row').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.fix-row').forEach(el=>{
    if(el.getAttribute('onclick')===`openMatch(${fid})`)el.classList.add('on');
  });

  // Switch to match view
  document.getElementById('landing').style.display='none';
  document.getElementById('mv').style.display='flex';
  document.getElementById('mv').style.flexDirection='column';

  // Loading state
  document.getElementById('mv-hdr').innerHTML='<div class="ld-msg"><div class="spnr"></div>Fetching match data…</div>';
  ['ov','lu','ls','sa','mu','tp','od'].forEach(t=>document.getElementById('tab-'+t).innerHTML='<div class="ld-msg"><div class="spnr"></div>Loading…</div>');
  switchTab('ov',document.querySelector('.tab-btn'));

  // ★ THE MAIN CALL — one request returns events + lineups + team stats + player stats
  // Use cache for non-live matches so clicking back+forward is instant.
  let detail = null;
  const cached = _fixtureDetailCache.get(fid);
  const cachedLive = cached && isLive(cached?.response?.[0]?.fixture?.status?.short);
  if(cached && !cachedLive){
    detail = cached; // instant — no API call
  } else {
    detail = await afFetch(`/fixtures?id=${fid}`);
    if(!detail || detail==='429'){
      // Retry once with backoff
      await new Promise(r=>setTimeout(r,1500));
      detail = await afFetch(`/fixtures?id=${fid}`);
    }
    if(detail) _fixtureDetailCache.set(fid, detail);
  }
  const fx=detail?.response?.[0];
  if(!fx){document.getElementById('mv-hdr').innerHTML='<div class="ld-msg" style="color:var(--high)">Failed to load fixture — API rate limit hit. Wait a moment and try again.</div>';return;}

  const ht=tinfo(fx.teams.home.name);
  const at=tinfo(fx.teams.away.name);

  // Render all tabs synchronously from the single response
  _lastFx=fx; _lastHt=ht; _lastAt=at;
  _saHomePlayers=[]; _saAwayPlayers=[]; // reset until season analysis loads
  resetBreaker(); // give each new fixture a clean attempt at player stats
  document.getElementById('mv-hdr').innerHTML=buildHeader(fx,ht,at);
  document.getElementById('tab-ov').innerHTML=buildOverviewTab(fx,ht,at);
  document.getElementById('tab-lu').innerHTML=buildLineupsTab(fx,ht,at);
  document.getElementById('tab-ls').innerHTML=buildLiveStatsTab(fx,ht,at);

  // Season analysis + Odds load in parallel (separate calls)
  loadSeasonAnalysis(fx.teams.home.id,fx.teams.away.id,fx,ht,at);
  loadOddsTab(fid,fx,ht,at);
  // Form strips + standings (non-blocking, fills placeholders in header/overview)
  loadMatchContext(fx,ht,at);

  // Auto-refresh every 30s for live matches
  if(isLive(fx.fixture.status.short)){
    _refreshTmr=setInterval(()=>refreshLive(fid),30000);
  }
}

async function refreshLive(fid){
  if(fid!==_activeId){clearInterval(_refreshTmr);_refreshTmr=null;return;}
  const detail=await afFetch(`/fixtures?id=${fid}`);
  const fx=detail?.response?.[0];
  if(!fx)return;
  // Update cache with fresh live data
  _fixtureDetailCache.set(fid, detail);
  const ht=tinfo(fx.teams.home.name);
  const at=tinfo(fx.teams.away.name);
  _lastFx=fx; _lastHt=ht; _lastAt=at;
  document.getElementById('mv-hdr').innerHTML=buildHeader(fx,ht,at);
  document.getElementById('tab-ov').innerHTML=buildOverviewTab(fx,ht,at);
  document.getElementById('tab-lu').innerHTML=buildLineupsTab(fx,ht,at);
  document.getElementById('tab-ls').innerHTML=buildLiveStatsTab(fx,ht,at);
  loadFixtures(); // refresh sidebar scores
  if(!isLive(fx.fixture.status.short)){clearInterval(_refreshTmr);_refreshTmr=null;}
}

// SECTION 7b — MATCH CONTEXT (form strips + standings)
// Loads in background after the match view renders
// ═══════════════════════════════════════════════════════════════
async function loadMatchContext(fx,ht,at){
  const hId=fx.teams.home.id, aId=fx.teams.away.id;
  const lgId=fx.league?.id, lgSeason=fx.league?.season;
  const isIntl=INTL_LEAGUES.has(lgId);

  // Load form + standings in parallel
  const [hForm,aForm,standings]=await Promise.all([
    afFetch(`/fixtures?team=${hId}&last=5&status=FT`),
    afFetch(`/fixtures?team=${aId}&last=5&status=FT`),
    isIntl?null:afFetch(`/standings?league=${lgId}&season=${lgSeason}`),
  ]);

  // ── Form strips ──────────────────────────────────────────────
  function processForm(data,teamId){
    const rows=data?.response||[];
    return rows.slice(-5).map(f=>{
      const isH=f.teams.home.id===teamId;
      const scored=isH?f.goals.home:f.goals.away;
      const conceded=isH?f.goals.away:f.goals.home;
      const opp=isH?f.teams.away.name:f.teams.home.name;
      const r=scored>conceded?'W':scored<conceded?'L':'D';
      return{r,scored,conceded,opp};
    });
  }
  function renderForm(form){
    if(!form.length)return`<span style="color:var(--dim);font-size:9px">No data</span>`;
    return form.map(m=>`<span class="form-b form-${m.r.toLowerCase()}" title="${m.r} vs ${m.opp} (${m.scored}-${m.conceded})">${m.r}</span>`).join('');
  }
  const hFd=processForm(hForm,hId), aFd=processForm(aForm,aId);
  const hEl=document.getElementById('ctx-form-h');
  const aEl=document.getElementById('ctx-form-a');
  if(hEl) hEl.innerHTML=renderForm(hFd);
  if(aEl) aEl.innerHTML=renderForm(aFd);

  // ── League standings ─────────────────────────────────────────
  if(!isIntl && standings?.response?.[0]?.league?.standings?.[0]){
    const table=standings.response[0].league.standings[0];
    const hIdx=table.findIndex(t=>t.team.id===hId);
    const aIdx=table.findIndex(t=>t.team.id===aId);

    // Build set of row indices to show: top 3 + 1 around each team
    const show=new Set([0,1,2]);
    [hIdx,aIdx].forEach(idx=>{
      if(idx>=0)[idx-1,idx,idx+1].forEach(i=>{if(i>=0&&i<table.length)show.add(i);});
    });
    const sorted=[...show].sort((a,b)=>a-b);

    let tbl='<div class="mini-table">';
    let prev=-1;
    for(const idx of sorted){
      if(prev>=0&&idx>prev+1)tbl+=`<div class="mini-table-gap">⋯</div>`;
      const t=table[idx];
      const isH=t.team.id===hId, isA=t.team.id===aId;
      const col=isH?ht.c:isA?at.c:'';
      const recentForm=(t.form||'').slice(-5).split('');
      const formDots=recentForm.map(r=>`<div class="mt-fb" style="background:${r==='W'?'#16a34a':r==='L'?'#dc2626':'#ca8a04'}"></div>`).join('');
      tbl+=`<div class="mini-table-row${isH||isA?' hl':''}" style="${col?'border-left:3px solid '+col+';':''}" title="${t.team.name} — ${t.points}pts, GD ${t.goalsDiff>=0?'+':''}${t.goalsDiff}">
        <span class="mt-pos">${t.rank}</span>
        <span class="mt-team" style="${col?'color:'+col:''}font-weight:${isH||isA?800:400}">${t.team.name}</span>
        <span class="mt-pts">${t.points}</span>
        <span class="mt-gd">${t.goalsDiff>=0?'+':''}${t.goalsDiff}</span>
        <div class="mt-form">${formDots}</div>
      </div>`;
      prev=idx;
    }
    tbl+='</div>';

    const stEl=document.getElementById('ctx-standings');
    if(stEl) stEl.innerHTML=tbl;
  } else if(!isIntl){
    const stEl=document.getElementById('ctx-standings');
    if(stEl) stEl.innerHTML=`<div style="color:var(--dim);font-size:11px;padding:4px 0">Standings available after season start</div>`;
  }
}
// (per-minute) or daily quota. Retrying immediately won't help for a daily
// quota, so this gives the user a clear explanation and a manual retry button
// rather than the UI silently grinding for minutes.
function buildRateLimitMessage(){
  return`<div class="no-data" style="padding:40px 20px">
    <i class="ti ti-alert-triangle" style="color:var(--med)"></i>
    <strong style="color:var(--med)">Player stats could not be loaded</strong><br>
    ${_callCount} API calls made this session. The player stats endpoint
    (<code>/players?id=X</code>) either exceeded the rate limit for your plan,
    or is not accessible from this browser context.<br><br>
    <strong>Season queried: 2025/26</strong> — only the current season is attempted.<br><br>
    <button onclick="resetBreaker();loadSeasonAnalysis(${_lastFx?.teams?.home?.id},${_lastFx?.teams?.away?.id},_lastFx,_lastHt,_lastAt)" style="background:var(--card2);border:1px solid var(--border2);color:var(--text);font-size:11px;padding:7px 16px;border-radius:6px;cursor:pointer;margin-top:4px">
      <i class="ti ti-refresh" style="font-size:11px;margin-right:4px"></i>Retry analysis
    </button>
  </div>`;
}

async function loadSeasonAnalysis(hId,aId,fx,ht,at){
  const isIntl = INTL_LEAGUES.has(fx.league?.id);
  const lineups = fx.lineups||[];
  const hasLineups = lineups.length >= 2;

  if(isIntl && hasLineups){
    // ── NATIONAL TEAM MATCH with confirmed lineup ───────────────
    // PHASE 1: Fetch starters in parallel (22 calls), render immediately.
    // PHASE 2: Fetch bench in background, update tab without user waiting.
    const hStarters = lineups[0]?.startXI?.map(p=>p.player).filter(p=>p?.id)||[];
    const hBench    = lineups[0]?.substitutes?.map(p=>p.player).filter(p=>p?.id)||[];
    const aStarters = lineups[1]?.startXI?.map(p=>p.player).filter(p=>p?.id)||[];
    const aBench    = lineups[1]?.substitutes?.map(p=>p.player).filter(p=>p?.id)||[];
    const seasonChain = seasonChainFromMode();
    const cSeason = seasonChain[0];
    const totalStarters = hStarters.length + aStarters.length;

    function showProgress(done, total, phase){
      document.getElementById('tab-sa').innerHTML=
        `<div class="ld-msg">
          <div class="spnr"></div>
          <span>${phase} — ${done}/${total} players loaded</span>
          <div class="ld-progress"><div class="ld-progress-fill" style="width:${Math.round(done/total*100)}%"></div></div>
        </div>`;
    }
    showProgress(0, totalStarters, 'Fetching starters');

    // Phase 1 — starters
    const starterResults = await fetchPlayersThrottled(
      [...hStarters,...aStarters], seasonChain,
      (done,total)=>showProgress(done,total,'Fetching starters')
    );
    if(_breakerTripped){document.getElementById('tab-sa').innerHTML=buildRateLimitMessage();return;}

    let i=0;
    const hStartP = starterResults.slice(i,i+=hStarters.length).map(p=>({...p,xistatus:'starter'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
    const aStartP = starterResults.slice(i,i+=aStarters.length).map(p=>({...p,xistatus:'starter'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));

    // Render starters immediately so users have data to read
    const hP = [...hStartP], aP = [...aStartP];
    _saHomePlayers=hP; _saAwayPlayers=aP;
    document.getElementById('tab-sa').innerHTML = buildSeasonTab(hP,aP,fx,ht,at,{isIntl,cSeason,src:'club',hasLineups:true,hStarters:hStartP.length,aStarters:aStartP.length});
    refreshPitchOverlay(); renderMatchupsTab(fx,ht,at); renderTopPicksTab(fx,ht,at);

    // Phase 2 — bench (background, non-blocking)
    if(hBench.length||aBench.length){
      const totalBench = hBench.length + aBench.length;
      const benchResults = await fetchPlayersThrottled(
        [...hBench,...aBench], seasonChain, null // no progress bar for background load
      );
      if(!_breakerTripped){
        let j=0;
        const hBenchP = benchResults.slice(j,j+=hBench.length).map(p=>({...p,xistatus:'bench'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
        const aBenchP = benchResults.slice(j,j+=aBench.length).map(p=>({...p,xistatus:'bench'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
        hP.push(...hBenchP); aP.push(...aBenchP);
        _saHomePlayers=hP; _saAwayPlayers=aP;
        // Only update the analysis tab if it's currently visible
        document.getElementById('tab-sa').innerHTML = buildSeasonTab(hP,aP,fx,ht,at,{isIntl,cSeason,src:'club',hasLineups:true,hStarters:hStartP.length,aStarters:aStartP.length});
        renderTopPicksTab(fx,ht,at);
      }
    }

  } else if(isIntl && !hasLineups){
    // ── NATIONAL TEAM MATCH, no lineup confirmed yet ────────────
    // /players/squads returns the full confirmed squad (23-26 players) the moment
    // a federation submits it — independent of any specific match's lineup.
    // This lets us show club-stat card probabilities for the whole squad pre-kickoff.
    document.getElementById('tab-sa').innerHTML=
      `<div class="ld-msg"><div class="spnr"></div>Fetching confirmed squad lists…</div>`;

    const [hSquad, aSquad] = await Promise.all([
      afFetch(`/players/squads?team=${hId}`),
      afFetch(`/players/squads?team=${aId}`),
    ]);
    const hSquadPlayers = hSquad?.response?.[0]?.players||[];
    const aSquadPlayers = aSquad?.response?.[0]?.players||[];

    if(hSquadPlayers.length && aSquadPlayers.length){
      document.getElementById('tab-sa').innerHTML=
        `<div class="ld-msg"><div class="spnr"></div>Fetching club stats for ${hSquadPlayers.length+aSquadPlayers.length} squad players — requests are rate-limited to ~1/sec, so this can take ${Math.ceil((hSquadPlayers.length+aSquadPlayers.length)*1.1/10)*10}–${Math.ceil((hSquadPlayers.length+aSquadPlayers.length)*1.4/10)*10}s for full squads…</div>`;

      const seasonChain = seasonChainFromMode();
      const cSeason = seasonChain[0];
      const allPlayers = [...hSquadPlayers, ...aSquadPlayers];
      const results = await fetchPlayersThrottled(allPlayers, seasonChain);

      const hP = results.slice(0, hSquadPlayers.length).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
      const aP = results.slice(hSquadPlayers.length).sort((a,b)=>(b.prob??-1)-(a.prob??-1));

      if(_breakerTripped){
        document.getElementById('tab-sa').innerHTML = buildRateLimitMessage();
        return;
      }
      document.getElementById('tab-sa').innerHTML = buildSeasonTab(hP,aP,fx,ht,at,{isIntl,cSeason,src:'squad'});
      _saHomePlayers=hP; _saAwayPlayers=aP;
      refreshPitchOverlay();
      renderMatchupsTab(fx,ht,at);
    renderTopPicksTab(fx,ht,at);
    } else {
      // Squads not submitted yet OR CORS blocked /players/squads — try national competition stats
      const seasons = seasonChainFromMode();

      async function fetchTeamIntl(id, name){
        for(const s of seasons){
              const r=await afFetch(`/players?team=${id}&season=${s}`);
          const n=r?.response?.length||0;
              if(n) return r;
        }
          return null;
      }

      const [hR,aR] = await Promise.all([
        fetchTeamIntl(hId, fx.teams.home.name),
        fetchTeamIntl(aId, fx.teams.away.name),
      ]);
      const hP = processPlayers(hR?.response||[]);
      const aP = processPlayers(aR?.response||[]);

      // If both come back empty, the request was blocked — show a clear diagnostic
      if(!hP.length && !aP.length){
        document.getElementById('tab-sa').innerHTML=`
          <div class="tip-box" style="margin-bottom:12px;border-color:rgba(212,21,21,.35);background:rgba(212,21,21,.06)">
            <strong style="color:var(--high)">⚠ No player stats available</strong><br><br>
            Squad data is not yet available from API-Football for this fixture.
            Check back closer to kickoff — once the lineup is confirmed, the Analysis tab will
            automatically show full club-season stats for each starter.
            <br><br>
            <b>Seasons attempted:</b> <code style="color:var(--gold)">${seasons.join(', ')}</code>
          </div>`;
        return;
      }

      document.getElementById('tab-sa').innerHTML = buildSeasonTab(hP,aP,fx,ht,at,{isIntl,src:'intl'});
      _saHomePlayers=hP; _saAwayPlayers=aP;
      renderMatchupsTab(fx,ht,at);
    renderTopPicksTab(fx,ht,at);
    }

  } else {
    // ── CLUB MATCH ──────────────────────────────────────────────
    const selSeason=parseInt(_seasonMode,10), cSeason=selSeason;

    if(hasLineups){
      // Pure player-ID queries through the Cloudflare Worker.
      // Every lineup player gets /players?id=X&season=Y — no name matching,
      // no team queries, no gap detection. Clean and reliable.
      const seasonChain=[selSeason, selSeason===lastClubSeason()?lastClubSeason()-1:lastClubSeason()];
      const hStarters=lineups[0]?.startXI?.map(p=>p.player).filter(p=>p?.id)||[];
      const hBench   =lineups[0]?.substitutes?.map(p=>p.player).filter(p=>p?.id)||[];
      const aStarters=lineups[1]?.startXI?.map(p=>p.player).filter(p=>p?.id)||[];
      const aBench   =lineups[1]?.substitutes?.map(p=>p.player).filter(p=>p?.id)||[];
      const totalS   =hStarters.length+aStarters.length;

      function showProg(done,total,phase){
        document.getElementById('tab-sa').innerHTML=`<div class="ld-msg">
          <div class="spnr"></div>
          <span>${phase} — ${done}/${total} players</span>
          <div class="ld-progress"><div class="ld-progress-fill" style="width:${Math.round(done/total*100)}%"></div></div>
        </div>`;
      }
      showProg(0,totalS,'Fetching starters');

      // Phase 1 — starters (render immediately so user sees data fast)
      resetBreaker();
      const sRes=await fetchPlayersThrottled(
        [...hStarters,...aStarters], seasonChain,
        (done,total)=>showProg(done,total,'Fetching starters')
      );
      if(_breakerTripped){document.getElementById('tab-sa').innerHTML=buildRateLimitMessage();return;}

      let i=0;
      const hStartP=sRes.slice(i,i+=hStarters.length).map(p=>({...p,xistatus:'starter'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
      const aStartP=sRes.slice(i,i+=aStarters.length).map(p=>({...p,xistatus:'starter'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));

      const hP=[...hStartP], aP=[...aStartP];
      _saHomePlayers=hP; _saAwayPlayers=aP;
      document.getElementById('tab-sa').innerHTML=buildSeasonTab(hP,aP,fx,ht,at,{isIntl:false,cSeason,src:'club',hasLineups:true,hStarters:hStartP.length,aStarters:aStartP.length});
      refreshPitchOverlay(); renderMatchupsTab(fx,ht,at); renderTopPicksTab(fx,ht,at);

      // Phase 2 — bench loads in background
      if(hBench.length||aBench.length){
        const bRes=await fetchPlayersThrottled([...hBench,...aBench],seasonChain,null);
        if(!_breakerTripped){
          let j=0;
          const hBenchP=bRes.slice(j,j+=hBench.length).map(p=>({...p,xistatus:'bench'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
          const aBenchP=bRes.slice(j,j+=aBench.length).map(p=>({...p,xistatus:'bench'})).sort((a,b)=>(b.prob??-1)-(a.prob??-1));
          hP.push(...hBenchP); aP.push(...aBenchP);
          _saHomePlayers=hP; _saAwayPlayers=aP;
          document.getElementById('tab-sa').innerHTML=buildSeasonTab(hP,aP,fx,ht,at,{isIntl:false,cSeason,src:'club',hasLineups:true,hStarters:hStartP.length,aStarters:aStartP.length});
          renderTopPicksTab(fx,ht,at);
        }
      }
    } else {
      // No lineup: team roster queries (shows full squad for pre-match analysis)
      document.getElementById('tab-sa').innerHTML=
        `<div class="ld-msg"><div class="spnr"></div>Loading ${cSeason}/${String(cSeason+1).slice(2)} squad…</div>`;

      const altSeason=selSeason===lastClubSeason()?lastClubSeason()-1:lastClubSeason();

      async function fetchTeamAllPages(teamId,season){
        const first=await afFetch(`/players?team=${teamId}&season=${season}`);
        if(!first?.response?.length) return [];
        const all=[...first.response];
        const total=first.paging?.total||1;
        if(total>1){
          const extras=await Promise.all(
            Array.from({length:total-1},(_,k)=>afFetch(`/players?team=${teamId}&season=${season}&page=${k+2}`))
          );
          for(const r of extras) if(r?.response) all.push(...r.response);
        }
        return all;
      }

      const [hPl,aPl,hAl,aAl]=await Promise.all([
        fetchTeamAllPages(hId,selSeason),fetchTeamAllPages(aId,selSeason),
        fetchTeamAllPages(hId,altSeason),fetchTeamAllPages(aId,altSeason),
      ]);

      function nn2(n){return(n||'').toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,' ').replace(/ +/g,' ').trim();}

      function buildSqLookup(players){
        const bN=new Map(),bS=new Map();
        for(const r of players){

          const e={id:p.id,name:p.name,pos,posL:posLabel(pos),photo:p.photo||null,fp90,tp90:tTK/mins*90,yc:tYC,apps:tA,mins,totalFouls:tFC,totalTackles:tTK,fd90:tFD/mins*90,drb90:tD/mins*90,duelsW90:tDW/mins*90,duelsT90:tDT/mins*90,prob:fM?null:cardProb(fp90,pos,tYC,tA),srcLeague:(pr.league?.name||'')+ex,srcTeam:pr.team?.name,srcSeason:pr.league?.season,lowConf:tA<8,foulsMissing:fM,isClub:true,noData:false};
          const n=nn2(p.name);bN.set(n,e);const s=n.split(' ').pop();if(!bS.has(s))bS.set(s,e);
