<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banits Betting v2</title>
<!-- PWA / installable app -->
<meta name="theme-color" content="#02091C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banits">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Banits Betting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="banits.css">
<body>
<!-- Mobile sidebar overlay backdrop -->
<div id="sb-overlay" onclick="closeSidebar()"></div>
<div id="app">

  <!-- SIDEBAR -->
  <div id="sb">
    <div class="sb-hd">
      <div class="sb-logo" onclick="goHome();closeSidebar()" role="button" tabindex="0" onkeydown="_kbActivate(event)">
        <i class="ti ti-shield-bolt"></i>Banits Betting<small>v2</small>
      </div>
    </div>
    <div class="sb-date-nav">
      <button onclick="changeDay(-1)" title="Previous day"><i class="ti ti-arrow-left"></i> Prev</button>
      <span id="sb-date-lbl">Today</span>
      <button onclick="changeDay(1)" title="Next day">Next <i class="ti ti-arrow-right"></i></button>
    </div>
    <!-- Home button — visible on mobile inside the sidebar -->
    <div class="sb-home-btn" onclick="goHome();closeSidebar()" role="button" tabindex="0" onkeydown="_kbActivate(event)">
      <i class="ti ti-home"></i> Home / Fixtures
    </div>
    <!-- Season data toggle -->
    <div class="sb-season-tog">
      <span class="sb-season-lbl">Season data</span>
      <div class="sb-season-btns">
  <button id="stog-2025" class="stog-btn" onclick="setSeasonMode('2025')">25/26</button>
        <button id="stog-2026" class="stog-btn" onclick="setSeasonMode('2026')">26/27</button>
      </div>
    </div>
    <div id="sb-list"></div>
    <div class="sb-ft">
      <div class="sb-ft-ttl">Data sources</div>
      <div><i class="ti ti-api" style="font-size:10px;margin-right:4px"></i>Live fixture & match data</div>
    <div id="sb-calls" style="margin-top:4px;color:var(--dim)">API calls: 0</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- Landing — populated by renderLanding() in JS -->
    <div id="landing"></div>

    <!-- Match view -->
    <div id="mv" style="display:none">
      <div class="mv-hdr" id="mv-hdr"></div>
      <div class="tab-nav">
        <button class="tab-btn on" onclick="switchTab('ov',this)"><i class="ti ti-chart-bar" style="font-size:11px;margin-right:4px"></i>Overview</button>
        <button class="tab-btn" onclick="switchTab('lu',this)"><i class="ti ti-layout-list" style="font-size:11px;margin-right:4px"></i>Lineups</button>
        <button class="tab-btn" onclick="switchTab('ls',this)"><i class="ti ti-activity" style="font-size:11px;margin-right:4px"></i>Live stats</button>
        <button class="tab-btn" onclick="switchTab('sa',this)"><i class="ti ti-target" style="font-size:11px;margin-right:4px"></i>Analysis</button>
        <button class="tab-btn" onclick="switchTab('mu',this)"><i class="ti ti-swords" style="font-size:11px;margin-right:4px"></i>Matchups</button>
        <button class="tab-btn" onclick="switchTab('tp',this)"><i class="ti ti-star" style="font-size:11px;margin-right:4px"></i>Top Picks</button>
        <button class="tab-btn" onclick="switchTab('od',this)"><i class="ti ti-trending-up" style="font-size:11px;margin-right:4px"></i>Predictions</button>
      </div>
      <div class="tab-panels">
        <div id="tab-ov" class="tab-pnl on"></div>
        <div id="tab-lu" class="tab-pnl"></div>
        <div id="tab-ls" class="tab-pnl"></div>
        <div id="tab-sa" class="tab-pnl"></div>
        <div id="tab-mu" class="tab-pnl"></div>
        <div id="tab-tp" class="tab-pnl"></div>
        <div id="tab-od" class="tab-pnl"></div>
      </div>
    </div>

  </div>
</div>
<script src="banits.js"></script>
</body>
</html>
